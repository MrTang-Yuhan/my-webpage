    <script>
      (function () {
        if (!window.CMS) return;

        const scopedPreviewCss = `

.cms-post-preview .post-content h2 { border-left: 3px solid var(--brand); padding-left: 0.55rem; }
.cms-post-preview .post-content ul, .cms-post-preview .post-content ol { padding-left: 1.3rem; }
.cms-post-preview .post-content table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); overflow-x: auto; display: block; }
.cms-post-preview .post-content th, .cms-post-preview .post-content td { border: 1px solid var(--line); padding: 0.5rem 0.65rem; }
.cms-post-preview .post-content th { background: var(--brand-soft); }
.cms-post-preview .post-content code { font-family: var(--font-mono); background: var(--code-bg); border-radius: 4px; padding: 0.1em 0.35em; }
.cms-post-preview .post-content pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; overflow-x: auto; }
.cms-post-preview .post-content pre code { background: transparent; padding: 0; }
.cms-post-preview .post-content img, .cms-post-preview .post-content video { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 1rem auto; }
.cms-post-preview .post-content blockquote { border-left: 4px solid var(--brand); background: var(--brand-soft); margin-left: 0; padding: 0.75rem 0.9rem; }
.cms-post-preview .post-content aside.footnote { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--panel); border-radius: 8px; margin: 0.5rem 0 1rem; padding: 0.55rem 0.7rem; color: var(--muted); }
.cms-post-preview .post-content .katex-block { overflow-x: auto; overflow-y: hidden; padding: 0.35rem 0; text-align: center; }
.cms-post-preview .post-tags { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 1rem; }
.cms-post-preview .tag { background: var(--brand-soft); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.6rem; font-size: 0.8rem; }
`;

        function registerVsCodeMarkdownItKatex(md, options) {
          const katex = window.katex;
          if (!md || !katex) return;
          const opts = options || {};

          function isWhitespace(char) {
            return /^\s$/u.test(char);
          }

          function isWordCharacterOrNumber(char) {
            return /^[\w\d]$/u.test(char);
          }

          function isValidInlineDelim(state, pos) {
            const prevChar = state.src[pos - 1];
            const char = state.src[pos];
            const nextChar = state.src[pos + 1];
            if (char !== '$') return { can_open: false, can_close: false };
            let canOpen = false;
            let canClose = false;
            if (prevChar !== '$' && prevChar !== '\\' && (prevChar === undefined || isWhitespace(prevChar) || !isWordCharacterOrNumber(prevChar))) {
              canOpen = true;
            }
            if (nextChar !== '$' && (nextChar === undefined || isWhitespace(nextChar) || !isWordCharacterOrNumber(nextChar))) {
              canClose = true;
            }
            return { can_open: canOpen, can_close: canClose };
          }

          function isValidBlockDelim(state, pos) {
            const prevChar = state.src[pos - 1];
            const char = state.src[pos];
            const nextChar = state.src[pos + 1];
            const nextCharPlus1 = state.src[pos + 2];
            if (char === '$' && prevChar !== '$' && prevChar !== '\\' && nextChar === '$' && nextCharPlus1 !== '$') {
              return { can_open: true, can_close: true };
            }
            return { can_open: false, can_close: false };
          }

          function inlineMath(state, silent) {
            if (state.src[state.pos] !== '$') return false;
            const lastToken = state.tokens[state.tokens.length - 1];
            if (lastToken && lastToken.type === 'html_inline' && /^<\w+.+[^/]>$/.test(lastToken.content)) {
              return false;
            }

            let res = isValidInlineDelim(state, state.pos);
            if (!res.can_open) {
              if (!silent) state.pending += '$';
              state.pos += 1;
              return true;
            }

            const start = state.pos + 1;
            let match = start;
            let pos;
            while ((match = state.src.indexOf('$', match)) !== -1) {
              pos = match - 1;
              while (state.src[pos] === '\\') pos -= 1;
              if (((match - pos) % 2) === 1) break;
              match += 1;
            }

            if (match === -1) {
              if (!silent) state.pending += '$';
              state.pos = start;
              return true;
            }
            if (match - start === 0) {
              if (!silent) state.pending += '$$';
              state.pos = start + 1;
              return true;
            }

            res = isValidInlineDelim(state, match);
            if (!res.can_close) {
              if (!silent) state.pending += '$';
              state.pos = start;
              return true;
            }

            if (!silent) {
              const token = state.push('math_inline', 'math', 0);
              token.markup = '$';
              token.content = state.src.slice(start, match);
            }
            state.pos = match + 1;
            return true;
          }

          function blockMath(state, start, end, silent) {
            let found = false;
            let pos = state.bMarks[start] + state.tShift[start];
            let max = state.eMarks[start];
            if (pos + 2 > max) return false;
            if (state.src.slice(pos, pos + 2) !== '$$') return false;
            pos += 2;
            let firstLine = state.src.slice(pos, max);
            const endIndexes = Array.from(firstLine.matchAll(/\$\$/g));
            if (endIndexes.length === 1 && endIndexes[0].index === firstLine.length - 2) {
              firstLine = firstLine.trim().slice(0, -2);
              found = true;
            } else if (endIndexes.length > 1) {
              return false;
            }
            if (silent) return true;

            let lastLine;
            let next;
            let lastPos;
            for (next = start; !found;) {
              next += 1;
              if (next >= end) break;
              pos = state.bMarks[next] + state.tShift[next];
              max = state.eMarks[next];
              if (pos < max && state.tShift[next] < state.blkIndent) break;
              if (state.src.slice(pos, max).trim().slice(-2) === '$$') {
                lastPos = state.src.slice(0, max).lastIndexOf('$$');
                lastLine = state.src.slice(pos, lastPos);
                found = true;
              } else if (state.src.slice(pos, max).trim().includes('$$')) {
                lastPos = state.src.slice(0, max).trim().indexOf('$$');
                lastLine = state.src.slice(pos, lastPos);
                found = true;
              }
            }

            state.line = next + 1;
            const token = state.push('math_block', 'math', 0);
            token.block = true;
            token.content = (firstLine && firstLine.trim() ? firstLine + '\n' : '') +
              state.getLines(start + 1, next, state.tShift[start], true) +
              (lastLine && lastLine.trim() ? lastLine : '');
            token.map = [start, state.line];
            token.markup = '$$';
            return true;
          }

          function inlineMathBlock(state, silent) {
            if (state.src.slice(state.pos, state.pos + 2) !== '$$') return false;
            let res = isValidBlockDelim(state, state.pos);
            if (!res.can_open) {
              if (!silent) state.pending += '$$';
              state.pos += 2;
              return true;
            }

            const start = state.pos + 2;
            let match = start;
            let pos;
            while ((match = state.src.indexOf('$$', match)) !== -1) {
              pos = match - 1;
              while (state.src[pos] === '\\') pos -= 1;
              if (((match - pos) % 2) === 1) break;
              match += 2;
            }

            if (match === -1) {
              if (!silent) state.pending += '$$';
              state.pos = start;
              return true;
            }
            if (match - start === 0) {
              if (!silent) state.pending += '$$$$';
              state.pos = start + 2;
              return true;
            }

            res = isValidBlockDelim(state, match);
            if (!res.can_close) {
              if (!silent) state.pending += '$$';
              state.pos = start;
              return true;
            }

            if (!silent) {
              const token = state.push('math_block', 'math', 0);
              token.block = true;
              token.markup = '$$';
              token.content = state.src.slice(start, match);
            }
            state.pos = match + 2;
            return true;
          }

          function escapeHtml(unsafe) {
            return String(unsafe)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#039;');
          }

          function renderInline(latex) {
            const displayMode = /\\begin\{(align|equation|gather|cd|alignat)\}/ig.test(latex);
            try {
              return katex.renderToString(latex, Object.assign({}, opts, { displayMode: displayMode }));
            } catch (error) {
              if (opts.throwOnError) console.log(error);
              return '<span class="katex-error" title="' + escapeHtml(latex) + '">' + escapeHtml(String(error)) + '</span>';
            }
          }

          function renderBlock(latex) {
            try {
              return '<p class="katex-block">' + katex.renderToString(latex, Object.assign({}, opts, { displayMode: true })) + '</p>';
            } catch (error) {
              if (opts.throwOnError) console.log(error);
              return '<p class="katex-block katex-error" title="' + escapeHtml(latex) + '">' + escapeHtml(String(error)) + '</p>';
            }
          }

          md.inline.ruler.after('escape', 'math_inline', inlineMath);
          md.inline.ruler.after('escape', 'math_inline_block', inlineMathBlock);
          md.block.ruler.after('blockquote', 'math_block', blockMath, {
            alt: ['paragraph', 'reference', 'blockquote', 'list']
          });
          md.renderer.rules.math_inline = function(tokens, idx) {
            const content = tokens[idx].content;
            const hasBacktick = content.length > 2 && content[0] === '`' && content[content.length - 1] === '`';
            return renderInline(hasBacktick ? content.slice(1, -1) : content);
          };
          md.renderer.rules.math_block = function(tokens, idx) {
            return renderBlock(tokens[idx].content) + '\n';
          };
        }

        const md = window.markdownit({ html: true, breaks: false, linkify: true });
        if (window.markdownitFootnote) md.use(window.markdownitFootnote);
        registerVsCodeMarkdownItKatex(md, { throwOnError: false, strict: 'ignore' });

        function normalizeFootnotes(html) {
          return html
            .replace(/<hr class="footnotes-sep">\s*/g, '')
            .replace(/<section class="footnotes">([\s\S]*?)<\/section>/g, function(_, section) {
              const items = [];
              const liPattern = /<li id="fn(\d+)" class="footnote-item">([\s\S]*?)<\/li>/g;
              let match;
              while ((match = liPattern.exec(section)) !== null) {
                const id = match[1];
                const body = match[2].replace(/<a href="#fnref\d+" class="footnote-backref">[\s\S]*?<\/a>/g, '').trim();
                items.push('<aside id="fn' + id + '" class="footnote">' + body + '</aside>');
              }
              return items.join('\n');
            });
        }

        function moveFootnotesNearRefs(root) {
          const byId = {};
          root.querySelectorAll('aside.footnote[id]').forEach(function(aside) {
            byId[aside.id] = aside;
          });
          const moved = new Set();
          root.querySelectorAll('sup.footnote-ref a[href^="#fn"]').forEach(function(link) {
            const id = (link.getAttribute('href') || '').replace('#', '');
            const aside = byId[id];
            if (!aside || moved.has(id)) return;
            const anchor = link.closest('p, li, blockquote, h1, h2, h3, h4, h5, h6');
            if (!anchor || !anchor.parentNode) return;
            anchor.parentNode.insertBefore(aside, anchor.nextSibling);
            moved.add(id);
          });
        }

        function getPreviewPostBaseDir(entry) {
          const pathValue = entry && typeof entry.get === 'function' ? entry.get('path') : '';
          const path = String(pathValue || '').replace(/\\/g, '/');
          if (path && /^src\/posts\/.+\/[^/]+\/index\.md$/.test(path)) {
            return path.replace(/^src/, '').replace(/\/index\.md$/, '/');
          }

          const archive = String(entry.getIn(['data', 'archive']) || '').trim();
          const explicitSlug = String(entry.get('slug') || '').trim();
          const postId = String(entry.getIn(['data', 'post_id']) || '').trim();
          const title = String(entry.getIn(['data', 'title']) || '').trim();
          const fallbackSlug = (explicitSlug || postId || title || 'preview')
            .toLocaleLowerCase('zh-Hans-CN')
            .replace(/\s+/g, '-')
            .replace(/[\\/]+/g, '-')
            .replace(/[^\w\u4e00-\u9fff-]+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '') || 'preview';
          if (!archive) return '';
          return '/posts/' + archive + '/' + fallbackSlug + '/';
        }

        function fixPreviewImagePaths(root, entry) {
          if (!root) return;
          const baseDir = getPreviewPostBaseDir(entry);
          root.querySelectorAll('img[src]').forEach(function (img) {
            const src = String(img.getAttribute('src') || '').trim();
            if (!src) return;
            if (/^(?:[a-z]+:|\/|#|data:|blob:)/i.test(src)) return;
            if (src.indexOf('./img/') === 0) {
              if (baseDir) img.setAttribute('src', baseDir + src.slice(2));
              return;
            }
            if (baseDir) {
              img.setAttribute('src', new URL(src, window.location.origin + baseDir).pathname);
            }
          });
        }

        function renderPreviewHtml(entry) {
          const body = entry.getIn(['data', 'body']) || '';
          const title = entry.getIn(['data', 'title']) || '';
          const date = entry.getIn(['data', 'date']) || '';
          const description = entry.getIn(['data', 'description']) || '';
          const tags = entry.getIn(['data', 'tags']) || [];
          const tagsArray = tags && typeof tags.toJS === 'function' ? tags.toJS() : (Array.isArray(tags) ? tags : []);

          let bodyHtml = md.render(String(body || ''));
          bodyHtml = normalizeFootnotes(bodyHtml);

          const tagsHtml = tagsArray
            .filter(Boolean)
            .map(function(tag) { return '<span class="tag">' + String(tag) + '</span>'; })
            .join('');

          return '' +
            '<article class="post">' +
              '<header class="post-header">' +
                '<h1 class="post-title">' + String(title) + '</h1>' +
                '<div class="post-meta">' +
                  (date ? '<span>' + String(date).slice(0, 10) + '</span><span class="post-divider">·</span>' : '') +
                  '<span>Preview</span>' +
                '</div>' +
                (description ? '<p>' + String(description) + '</p>' : '') +
              '</header>' +
              '<div class="post-content">' + bodyHtml + '</div>' +

        function normalizeArchiveName(value) {
          let name = String(value || '').trim();
          name = name.replace(/^['"`]+|['"`]+$/g, '');
          return name;
        }

        function isValidArchiveName(value) {
          const name = normalizeArchiveName(value);
          if (!name) return false;
          if (name.length > 80) return false;
          if (name.includes('/') || name.includes('\\')) return false;
          if (/\.md$/i.test(name)) return false;
          if (/^index\.md$/i.test(name)) return false;
          if (/^\[object object\]$/i.test(name)) return false;
          if (/^(null|undefined|nan|true|false)$/i.test(name)) return false;
          if (/[<>{}\[\]()]/.test(name)) return false;
          if (/[\u0000-\u001f]/.test(name)) return false;
          return ARCHIVE_NAME_PATTERN.test(name);
        }

        function dedupeSortArchives(items) {
          const seen = new Set();
          const result = [];
          (items || []).forEach(function (item) {
            const name = normalizeArchiveName(item);
            if (!isValidArchiveName(name) || seen.has(name)) return;
            seen.add(name);
            result.push(name);
          });
          return result.sort(function (a, b) {
            return a.localeCompare(b, 'zh-Hans-CN');
          });

        function escapeMarkdownHtml(value) {
          return String(value || '').replace(/[&<>"']/g, function(char) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
          });
        }

        function highlightMarkdownLine(line) {
          let html = escapeMarkdownHtml(line);
          if (/^\s*```/.test(line)) return '<span class="md-code">' + html + '</span>';
          if (/^\s*#/.test(line)) return html.replace(/^(\s*#{1,6})(.*)$/, '<span class="md-heading">$1$2</span>');
          if (/^\s*>/.test(line)) return '<span class="md-quote">' + html + '</span>';
          html = html.replace(/(^|\s)([-*+] |\d+\. )/g, '$1<span class="md-marker">$2</span>');
          html = html.replace(/(\[.*?\]\(.*?\))/g, '<span class="md-link">$1</span>');
          html = html.replace(/(\*\*[^*\n]+\*\*|__[^_\n]+__|(?<!\*)\*[^*\n]+\*)/g, '<span class="md-emphasis">$1</span>');
          html = html.replace(/(\$\$?[^$\n]+\$\$?)/g, '<span class="md-math">$1</span>');
          html = html.replace(/(`[^`]+`)/g, '<span class="md-code">$1</span>');
          return html;
        }

        function updateMarkdownHighlight() {
          if (!markdownEditorHighlight || !markdownEditorTextarea) return;

        function findBodySlateEditor() {
          const editors = Array.from(document.querySelectorAll('[contenteditable="true"][role="textbox"], [contenteditable="true"][data-slate-editor="true"]'));

              const label = String(node.getAttribute('aria-label') || '');
              const text = String(node.textContent || '');

        function setupSlateMarkdownHighlight(editor) {

          editor.addEventListener('beforeinput', scheduleSlateMarkdownHighlight);

          editor.addEventListener('keyup', scheduleSlateMarkdownHighlight);
          editor.addEventListener('compositionend', scheduleSlateMarkdownHighlight);
          editor.addEventListener('paste', scheduleSlateMarkdownHighlight);
          editor.addEventListener('scroll', syncSlateMarkdownHighlightScroll);
          markdownSlateEditorObserver = new MutationObserver(scheduleSlateMarkdownHighlight);
          markdownSlateEditorObserver.observe(editor, { childList: true, subtree: true, characterData: true });

        function getSlateMarkdownSource() {
          if (!markdownSlateEditor) return '';
          const blocks = Array.from(markdownSlateEditor.querySelectorAll(':scope > [data-slate-node="element"]'));
          if (!blocks.length) return String(markdownSlateEditor.textContent || '').replace(/\uFEFF/g, '');
          return blocks.map(function(block) {
            const strings = Array.from(block.querySelectorAll('[data-slate-string="true"]'));
            const value = strings.length
              ? strings.map(function(node) { return String(node.textContent || ''); }).join('')
              : String(block.textContent || '');
            return value.replace(/\uFEFF/g, '');
          }).join('\n');

        function positionSlateMarkdownHighlight() {

          markdownSlateHighlight.style.overflowWrap = editorStyle.overflowWrap;

          markdownSlateHighlight.style.right = 'auto';

        function scheduleSlateMarkdownHighlight() {

        function syncSlateMarkdownHighlightScroll() {

          const statusEl = panel.querySelector('#upload-image-only-status');
          if (imageButton.dataset.bound !== '1') {
            imageButton.dataset.bound = '1';
            imageButton.addEventListener('click', function() {
              const textarea = findBodyTextarea();
              const snapshot = textarea ? String(textarea.value || '') : '';
              const imageControl = findImageUploadControl();
              if (!imageControl) {
                statusEl.style.color = '#b91c1c';
                statusEl.textContent = '未找到 Decap 图片上传入口。请确认 image_upload 字段已加载。';
                return;
              }

              statusEl.style.color = '#475569';
              statusEl.textContent = '已打开图片上传；文件进入 /img，正文引用 img/文件名。';
              startUploadOnlyMarkdownGuard(snapshot);
              imageControl.click();
            });
          }
          if (attachmentButton.dataset.bound === '1') return;
          attachmentButton.dataset.bound = '1';
          attachmentButton.addEventListener('click', function() {
            const textarea = findBodyTextarea();
            const snapshot = textarea ? String(textarea.value || '') : '';
            const fileControl = findAttachmentUploadControl();
            if (!fileControl) {
              statusEl.style.color = '#b91c1c';
              statusEl.textContent = '未找到 Decap 附件上传入口。请确认 attachment_upload 字段已加载。';
              return;
            }

            statusEl.style.color = '#475569';
            statusEl.textContent = '已打开附件上传；文件进入 /attach，正文引用 attach/文件名。';
            startUploadOnlyMarkdownGuard(snapshot);
            fileControl.click();
          });
        }

        function findAttachmentUploadControl() {
          const fieldNode = findFieldContainerByText(/附件上传入口|attachment_upload|上传附件|attach\//);
          if (!fieldNode) return null;
          const controls = Array.from(fieldNode.querySelectorAll('button, [role="button"], input[type="file"]'));
          return controls.find(function(control) {
            const label = [
              control.textContent || '',
              control.getAttribute('aria-label') || '',
              control.getAttribute('title') || '',
              control.getAttribute('name') || ''
            ].join(' ').trim().toLowerCase();
            return control.tagName === 'INPUT' || /choose|upload|select|browse|media|file|上传|选择|浏览|媒体|文件|附件/.test(label);
          }) || null;
        }

        function findImageUploadControl() {
          const fieldNode = findFieldContainerByText(/图片上传入口|image_upload|上传图片|img\//);
          if (!fieldNode) return null;
          const controls = Array.from(fieldNode.querySelectorAll('button, [role="button"], input[type="file"]'));
          return controls.find(function(control) {
            const label = [
              control.textContent || '',
              control.getAttribute('aria-label') || '',
              control.getAttribute('title') || '',
              control.getAttribute('name') || ''
            ].join(' ').trim().toLowerCase();
            return control.tagName === 'INPUT' || /choose|upload|select|browse|media|image|file|上传|选择|浏览|媒体|图片|图像|文件/.test(label);
          }) || null;
        }

        function findFieldContainerByText(pattern) {
          const candidates = Array.from(document.querySelectorAll('label, [data-testid], [class*="Field"], [class*="field"]'));
          const match = candidates.find(function(node) {
            if (node.closest('#cms-editor-tools-host')) return false;
            return pattern.test(String(node.textContent || ''));
          });
          if (!match) return null;
          let node = match;
          for (let i = 0; node && i < 6; i += 1, node = node.parentElement) {
            if (node.querySelector('button, [role="button"], input[type="file"]')) return node;
          }
          return match;
        }

        function findGlobalMediaButton() {
          const controls = Array.from(document.querySelectorAll('button, [role="button"], a'));
          return controls.find(function(control) {
            if (control.closest('#cms-editor-tools-host')) return false;
            const label = [
              control.textContent || '',
              control.getAttribute('aria-label') || '',
              control.getAttribute('title') || ''
            ].join(' ').trim().toLowerCase();
            return /\bmedia\b|媒体|图片|图像|image|asset/.test(label);
          }) || null;
        }

        function findEditorToolbarFallbackAnchor() {
          const textarea = findBodyTextarea();
          if (!textarea) return null;
          let node = textarea.parentElement;
          for (let i = 0; node && i < 8; i += 1, node = node.parentElement) {
            const controls = Array.from(node.querySelectorAll('button, [role="button"], [role="tab"], a'));
            const hasEditorControls = controls.some(function(control) {
              const label = [
                control.textContent || '',
                control.getAttribute('aria-label') || '',
                control.getAttribute('title') || ''
              ].join(' ').trim().toLowerCase();
              return /\bsave\b|publish|media|图片|image|markdown|预览|preview|编辑/.test(label);
            });
            if (hasEditorControls) return node;
          }
          return textarea.parentElement || textarea.parentNode;
        }

        function findMarkdownToolbarAnchor() {
          const addComponent = Array.from(document.querySelectorAll('button, [role="button"], [role="tab"]')).find(function(control) {
            return String(control.getAttribute('title') || '').trim().toLowerCase() === 'add component';
          });
          if (!addComponent) return null;
          let node = addComponent.parentElement;
          for (let depth = 0; node && depth < 6; depth += 1, node = node.parentElement) {
            const controls = Array.from(node.querySelectorAll('button, [role="button"], [role="tab"]'));
            const hasMarkdownToolbar = controls.some(function(control) {
              return String(control.getAttribute('title') || '').trim().toLowerCase() === 'bold';
            }) && controls.some(function(control) {
              return String(control.getAttribute('title') || '').trim().toLowerCase() === 'add component';
            });
            if (hasMarkdownToolbar && !node.querySelector('[contenteditable="true"]')) return node;
          }
          return addComponent.parentElement;
        }

        function isSafeUploadToolbarAnchor(node) {
          if (!node || !(node instanceof Element)) return false;
          if (node.id === 'cms-editor-tools-host') return false;
          if (node.querySelector('textarea, [role="textbox"], [contenteditable="true"]')) return false;
          const controls = node.querySelectorAll('button, [role="button"], [role="tab"], a');
          return controls.length > 0 && controls.length < 20;
        }

        function findAddComponentToolbarAnchor() {
          const markdownToolbar = findMarkdownToolbarAnchor();
          if (markdownToolbar) return markdownToolbar;
          const controls = Array.from(document.querySelectorAll('button, [role="button"], [role="tab"]'));
          const addComponentControl = controls.find(function(control) {
            if (control.closest('#cms-editor-tools-host')) return false;
            if (control.closest('[data-cms-editor-global-nav="hidden"]')) return false;
            const label = [
              control.textContent || '',
              control.getAttribute('aria-label') || '',
              control.getAttribute('title') || ''
            ].join(' ').trim().toLowerCase();
            return /add\s*component|component|组件|添加/.test(label);
          });
          if (addComponentControl) {
            return addComponentControl.parentElement || addComponentControl.parentNode;
          }

          const textarea = findBodyTextarea();
          if (!textarea) return null;
          let node = textarea.parentElement;
          for (let i = 0; node && i < 5; i += 1, node = node.parentElement) {
            const buttons = Array.from(node.querySelectorAll('button, [role="button"], [role="tab"]'));
            const addComponentButton = buttons.find(function(button) {
              if (button.closest('#cms-editor-tools-host')) return false;
              if (button.closest('[data-cms-editor-global-nav="hidden"]')) return false;
              const label = [
                button.textContent || '',
                button.getAttribute('aria-label') || '',
                button.getAttribute('title') || ''
              ].join(' ').trim().toLowerCase();
              return /add\s*component|component|组件|添加/.test(label);
            });
            if (addComponentButton) return addComponentButton.parentElement || node;
          }
          return textarea.parentElement || textarea.parentNode;
        }

        function isEditorBodyReady() {
          const textarea = findBodyTextarea();
          const slateEditor = findBodySlateEditor();
          return !!(((textarea && textarea.parentNode) || slateEditor) && !isPostsEditorLoading());
        }

        function startUploadOnlyMarkdownGuard(snapshot) {
          if (!snapshot) return;
          const startedAt = Date.now();
          const stopAt = startedAt + 7000;
          function restoreIfChanged() {
            if (!isPostsEditorRoute()) return;
            const textarea = findBodyTextarea();
            if (textarea && String(textarea.value || '') !== snapshot) {
              textarea.value = snapshot;
              textarea.dispatchEvent(new Event('input', { bubbles: true }));
              textarea.dispatchEvent(new Event('change', { bubbles: true }));
            }
            if (Date.now() < stopAt) window.setTimeout(restoreIfChanged, 160);
          }
          restoreIfChanged();
        }

        async function syncArchiveMovePanel() {
          const entryPath = getRouteEntryPath();
          const parts = getPathParts(entryPath);
          const existing = document.getElementById('archive-move-panel');
          if (!parts || !isEditorBodyReady()) {
            if (existing) existing.style.display = 'none';
            return;
          }

          const panel = ensureMovePanel();
          panel.style.display = '';
          const currentEl = panel.querySelector('#archive-move-current');
          const targetInput = panel.querySelector('#archive-move-target');
          const statusEl = panel.querySelector('#archive-move-status');
          const moveBtn = panel.querySelector('#archive-move-btn');
          currentEl.textContent = '当前路径: ' + parts.path;
          if (!targetInput.value) targetInput.value = parts.archive;

          const options = await getCachedArchiveDirs();
          syncArchiveDatalist(options);

          if (moveBtn.dataset.bound === '1') return;
          moveBtn.dataset.bound = '1';
          moveBtn.addEventListener('click', async function() {
            const latestPath = getRouteEntryPath();
            const latest = getPathParts(latestPath);
            if (!latest) {
              statusEl.style.color = '#b91c1c';
              statusEl.textContent = '当前条目路径不可识别，无法移动。';
              return;
            }
            const targetArchive = sanitizeArchiveInput(targetInput.value);
            if (!targetArchive) {
              statusEl.style.color = '#b91c1c';
              statusEl.textContent = '目标 archive 非法。只允许字母、数字、下划线、连字符或中文，不可包含斜杠或 .md。';
              return;
            }
            if (targetArchive === latest.archive) {
              statusEl.style.color = '#475569';
              statusEl.textContent = '目标 archive 与当前一致，无需移动。';
              return;
            }

            moveBtn.disabled = true;
            statusEl.style.color = '#475569';
            statusEl.textContent = '正在提交移动...';
            try {
              const cfg = await parseRepoAndBranch();
              const moved = await callMovePostApi({
                repo: cfg.repo,
                branch: cfg.branch,
                oldArchive: latest.archive,
                targetArchive: targetArchive,
                slug: latest.slug
              });

              statusEl.style.color = '#065f46';
              statusEl.textContent = '迁移成功，共移动 ' + moved.movedCount + ' 个文件。提交: ' + (moved.commitSha || '-') + '。请刷新列表并重新打开新路径文章继续编辑。';
            } catch (err) {
              statusEl.style.color = '#b91c1c';
              statusEl.textContent = '移动失败: ' + String((err && err.message) || err || 'unknown error');
            } finally {
              moveBtn.disabled = false;
            }
          });
        }

        function hideEditorTransientPanels() {
          const uploadPanel = document.getElementById('upload-image-only-panel');
          if (uploadPanel) uploadPanel.style.display = 'none';
          const movePanel = document.getElementById('archive-move-panel');
          if (movePanel) movePanel.style.display = 'none';
        }

        function removeEditorTransientPanels() {
          ['upload-image-only-panel', 'archive-move-panel'].forEach(function(id) {
            const panel = document.getElementById(id);
            if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
          });
        }

        function clearEmptyBodyRecovery() {
          if (emptyBodyRecoveryTimer !== null) {
            window.clearTimeout(emptyBodyRecoveryTimer);
            emptyBodyRecoveryTimer = null;
          }
          emptyBodyRecoveryPath = '';
        }

        function syncEmptyBodyRecovery() {
          if (!isExistingPostsEntryRoute() || isPostsEditorLoading()) {
            clearEmptyBodyRecovery();
            return;
          }

          const entryPath = getRouteEntryPath();
          const textarea = findBodyTextarea();
          if (!entryPath || !textarea || !textarea.parentNode) {
            clearEmptyBodyRecovery();
            return;
          }

          if (String(textarea.value || '').trim()) {
            try {
              sessionStorage.removeItem(EMPTY_BODY_RECOVERY_KEY_PREFIX + entryPath);
            } catch (_) {}
            clearEmptyBodyRecovery();
            return;
          }

          try {
            if (sessionStorage.getItem(EMPTY_BODY_RECOVERY_KEY_PREFIX + entryPath) === '1') return;
          } catch (_) {}

          if (emptyBodyRecoveryTimer !== null && emptyBodyRecoveryPath === entryPath) return;
          clearEmptyBodyRecovery();
          emptyBodyRecoveryPath = entryPath;
          emptyBodyRecoveryTimer = window.setTimeout(function() {
            emptyBodyRecoveryTimer = null;
            if (!isExistingPostsEntryRoute() || isPostsEditorLoading()) return;
            if (getRouteEntryPath() !== entryPath) return;
            const latestTextarea = findBodyTextarea();
            if (!latestTextarea || String(latestTextarea.value || '').trim()) return;
            if (document.activeElement === latestTextarea) return;
            try {
              sessionStorage.setItem(EMPTY_BODY_RECOVERY_KEY_PREFIX + entryPath, '1');
            } catch (_) {}
            window.location.reload();
          }, 3200);
        }

        function findBodyTextarea() {
          const textareas = Array.from(document.querySelectorAll('textarea'));
          if (!textareas.length) return null;

          const strongMatch = textareas.find(function (el) {
            const label = [
              el.getAttribute('name') || '',
              el.getAttribute('id') || '',
              el.getAttribute('aria-label') || '',
              el.getAttribute('placeholder') || '',
              el.getAttribute('data-testid') || ''
            ].join(' ').toLowerCase();
            if (/(^|[\s_-])body([\s_-]|$)/.test(label) || /(^|[\s_-])markdown([\s_-]|$)/.test(label)) return true;
            let node = el.parentElement;
            for (let depth = 0; node && depth < 8; depth += 1, node = node.parentElement) {
              const marker = [node.getAttribute('data-field-name'), node.getAttribute('data-name'), node.getAttribute('data-testid'), node.getAttribute('name')].filter(Boolean).join(' ').toLowerCase();
              if (/(^|[\s_-])body([\s_-]|$)/.test(marker) || /field[-_ ]body/.test(marker)) return true;
              if (/(^|[\s_-])description([\s_-]|$)/.test(marker)) return false;
            }
            return false;
          });
          if (strongMatch) return strongMatch;

          // Decap may omit a stable name from the raw Markdown textarea. In that
          // case, only accept a textarea inside the single field labelled 正文;
          // never guess from text length, which can attach the editor to 摘要.
          for (const textarea of textareas) {
            let node = textarea.parentElement;
            for (let depth = 0; node && depth < 8; depth += 1, node = node.parentElement) {
              const fields = node.querySelectorAll('textarea');
              if (fields.length === 1 && /(?:^|[\s：:])正文(?:$|[\s：:])/.test(String(node.textContent || ''))) {
                return textarea;
              }
            }
          }
          return null;
        }

        function forceRevealEditorPane() {
          if (!isPostsEditorRoute()) return;
          const textarea = findBodyTextarea();
          if (!textarea) return;
          let node = textarea;
          for (let i = 0; node && i < 8; i += 1, node = node.parentElement) {
            const style = window.getComputedStyle(node);
            if (style.display === 'none') node.style.display = '';
            if (style.visibility === 'hidden') node.style.visibility = '';
            if (style.height === '0px') node.style.height = '';
            if (style.overflow === 'hidden' && !node.textContent.trim()) node.style.overflow = '';
            if (node.hasAttribute('data-cms-editor-loading-hidden')) {
              node.removeAttribute('data-cms-editor-loading-hidden');
              node.removeAttribute('data-cms-editor-loading-display');
            }
          }
        }

        window.CMS.registerWidget('archive-combobox', ArchiveComboboxControl);
        window.CMS.registerPreviewStyle(scopedPreviewCss, { raw: true });
        window.CMS.registerPreviewStyle('https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css');
        window.CMS.registerPreviewTemplate('posts', PostPreview);
        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function(args) {
            if (markdownEditorTextarea) {
              markdownEditorTextarea.dispatchEvent(new Event('input', { bubbles: true }));
              markdownEditorTextarea.dispatchEvent(new Event('change', { bubbles: true }));
            }
            const entry = args && args.entry;
            const data = entry && typeof entry.get === 'function' ? entry.get('data') : null;
            if (!data || typeof data.get !== 'function' || typeof data.set !== 'function') return data;
            let nextData = data;
            if (typeof nextData.delete === 'function') {
              nextData = nextData.delete('image_upload');
              nextData = nextData.delete('attachment_upload');
            }
            const existingPostId = String(nextData.get('post_id') || '').trim();
            const now = new Date();
            const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
            if (existingPostId) return nextData.set('updated', today);

            const title = String(nextData.get('title') || 'untitled').trim();
            const date = String(nextData.get('date') || '').slice(0, 10);
            const source = [date, title].filter(Boolean).join('-') || 'untitled';
            const generatedPostId = source
              .toLocaleLowerCase('zh-Hans-CN')
              .replace(/\s+/g, '-')
              .replace(/[\\/]+/g, '-')
              .replace(/[^\w\u4e00-\u9fff-]+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '') || 'untitled';
            return nextData.set('post_id', generatedPostId).set('updated', date || today);
          }
        });

        window.CMS.init();

        function isPostsEditorRoute() {
          const hash = getDecodedHash().toLowerCase();
          return /\/collections\/posts\/(?:new|entries\/)/.test(hash);
        }

        function syncEditorTabsVisibility() {
          try {
            const shouldHide = isPostsEditorRoute();
            const currentRoute = getDecodedHash().split('?')[0];
            const routeChanged = currentRoute !== editorRouteKey;
            if (routeChanged) {
              editorRouteKey = currentRoute;
              disposeMarkdownHighlightEditor();
              removeEditorTransientPanels();
              clearEmptyBodyRecovery();
            }
            document.body.classList.toggle('cms-editor-mode', shouldHide);
            const toolsHost = document.getElementById('cms-editor-tools-host');
            if (toolsHost && !shouldHide) toolsHost.style.display = 'none';
            if (!shouldHide) {
              disposeMarkdownHighlightEditor();
              removeEditorTransientPanels();
              hideEditorTransientPanels();
            }
            const isLoading = syncLoadingEditorTools();
            if (isLoading) {
              disposeMarkdownHighlightEditor();
              removeEditorTransientPanels();
              hideEditorTransientPanels();
              syncGlobalAdminNavVisibility(shouldHide);
              syncEmptyBodyRecovery();
              return;
            }
            syncMarkdownHighlightEditor();
            syncArchiveMovePanel();
            syncUploadImageOnlyPanel();
            syncEmptyBodyRecovery();
            syncGlobalAdminNavVisibility(shouldHide);
          } catch (_) {
            // Keep CMS UI available if editor chrome sync fails.
          }
        }

        function syncGlobalAdminNavVisibility(shouldHide) {
          const previous = Array.from(document.querySelectorAll('[data-cms-editor-global-nav="hidden"]'));
          previous.forEach(function(node) {
            node.removeAttribute('data-cms-editor-global-nav');
            node.style.visibility = '';
            node.style.height = '';
            node.style.overflow = '';
            node.style.margin = '';
            node.style.padding = '';
            node.style.border = '';
          });
          if (!shouldHide) return;

          const candidates = Array.from(document.querySelectorAll(
            '[role="tablist"], nav, [role="navigation"]'
          ));
          candidates.forEach(function(candidate) {
            if (candidate.id === 'cms-editor-tools-host' || candidate.closest('#cms-editor-tools-host')) return;
            const controls = Array.from(candidate.querySelectorAll('a, button, [role="tab"], [role="button"]'));
            const labels = (controls.length ? controls : [candidate]).map(function(t) {
              return (t.textContent || '').trim().toLowerCase();
            }).filter(Boolean);
            const flatLabels = labels.join(' | ');
            const hasContents = labels.includes('contents') || labels.includes('内容') || /\bcontents\b/.test(flatLabels);
            const hasWorkflow = labels.includes('workflow') || labels.includes('工作流') || /\bworkflow\b/.test(flatLabels);
            const hasMedia = labels.includes('media') || labels.includes('媒体') || /\bmedia\b/.test(flatLabels);
            const hasEditorActions = /\bsave\b|\bpublish\b|保存|发布/.test(flatLabels);
            const isTarget = (hasContents && hasWorkflow) || (hasContents && hasMedia);
            if (hasEditorActions) return;
            if (!isTarget) return;

            candidate.setAttribute('data-cms-editor-global-nav', 'hidden');
            candidate.style.visibility = 'hidden';
            candidate.style.height = '0';
            candidate.style.overflow = 'hidden';
            candidate.style.margin = '0';
            candidate.style.padding = '0';
            candidate.style.border = '0';
          });
        }

        let editorSyncTimer = null;
        let editorChromeTimeouts = [];
        function clearEditorChromeTimeouts() {
          editorChromeTimeouts.forEach(function(timer) { window.clearTimeout(timer); });
          editorChromeTimeouts = [];
        }
        function scheduleEditorChromeSync() {
          if (editorSyncTimer !== null) window.clearTimeout(editorSyncTimer);
          editorSyncTimer = window.setTimeout(function() {
            editorSyncTimer = null;
            syncEditorTabsVisibility();
          }, 120);
        }

        function syncEditorChromeSoon() {
          clearEditorChromeTimeouts();
          syncEditorTabsVisibility();
          syncUploadImageOnlyPanel();
          forceRevealEditorPane();
          editorChromeTimeouts.push(window.setTimeout(syncEditorTabsVisibility, 120));
          editorChromeTimeouts.push(window.setTimeout(syncUploadImageOnlyPanel, 130));
          editorChromeTimeouts.push(window.setTimeout(forceRevealEditorPane, 140));
          editorChromeTimeouts.push(window.setTimeout(syncEditorTabsVisibility, 500));
          editorChromeTimeouts.push(window.setTimeout(syncUploadImageOnlyPanel, 520));
          editorChromeTimeouts.push(window.setTimeout(forceRevealEditorPane, 540));
          editorChromeTimeouts.push(window.setTimeout(syncEditorTabsVisibility, 1200));
          editorChromeTimeouts.push(window.setTimeout(syncUploadImageOnlyPanel, 1220));
          editorChromeTimeouts.push(window.setTimeout(forceRevealEditorPane, 1240));
        }

        window.addEventListener('hashchange', syncEditorChromeSoon);
        syncEditorChromeSoon();
        const observer = new MutationObserver(scheduleEditorChromeSync);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
